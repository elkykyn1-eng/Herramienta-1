<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Instrumentos de Campo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#12151a">
<style>
  :root{
    --bg:#12151a;
    --panel:#1b2029;
    --panel-2:#20262f;
    --bezel-1:#2a3038;
    --bezel-2:#0c0e12;
    --brass:#c9a35a;
    --brass-dim:#6e5c39;
    --text:#ece7dd;
    --muted:#8b93a0;
    --good:#5fa986;
    --warn:#c1554a;
    --face:#0e1116;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);}
  body{
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:stretch;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #232a34 0%, var(--bg) 55%);
  }
  .device{
    width:100%;
    max-width:430px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    padding:22px 20px 28px;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .brand{
    font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:13px;
    letter-spacing:.18em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .brand b{color:var(--brass);font-weight:700;}
  .lamp{
    width:9px;height:9px;border-radius:50%;
    background:#3a4048;
    box-shadow:inset 0 0 2px #000;
    transition:background .3s, box-shadow .3s;
  }
  .lamp.on{background:var(--good);box-shadow:0 0 8px var(--good), inset 0 0 2px #063;}
  .lamp.warn{background:var(--warn);box-shadow:0 0 8px var(--warn);}
  .status-row{display:flex;align-items:center;gap:7px;}
  .status-row span{font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
  }

  /* Bezel / instrument housing */
  .instrument{
    position:relative;
    width:min(78vw,300px);
    aspect-ratio:1;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, var(--bezel-1), var(--bezel-2) 70%);
    box-shadow:
      0 18px 40px -12px #000,
      inset 0 0 0 2px #3a414c,
      inset 0 -6px 14px #000;
    padding:14px;
    display:flex;
  }
  .face{
    width:100%;height:100%;border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #171b21, var(--face) 75%);
    box-shadow:inset 0 0 18px #000, inset 0 0 0 1px #2a2f38;
    position:relative;
    overflow:hidden;
  }
  svg{width:100%;height:100%;display:block;}
  .tick{stroke:#565f6c;stroke-width:1.4;}
  .tick.major{stroke:var(--text);stroke-width:2.2;}
  .label-cardinal{
    fill:var(--brass);
    font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-weight:700;
    font-size:17px;
    text-anchor:middle;
  }
  .label-inter{
    fill:var(--muted);
    font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-weight:500;
    font-size:10px;
    text-anchor:middle;
  }
  #compass-rose{transform-origin:160px 160px;transition:transform .15s ease-out;}
  .pointer{fill:var(--brass);}
  .ref-pointer{fill:var(--warn);}
  .label-km{
    fill:var(--brass);
    font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-weight:700;
    font-size:13px;
    text-anchor:middle;
  }

  #alt-settings-btn{
    position:absolute;
    top:10px;left:10px;z-index:5;
    width:30px;height:30px;
    border-radius:50%;
    border:1px solid #333a44;
    background:var(--panel);
    color:var(--muted);
    font-size:14px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  #alt-settings-btn:active{transform:translateY(1px);}
  #alt-settings-panel{
    position:absolute;
    top:46px;left:10px;z-index:6;
    background:var(--panel-2);
    border:1px solid #333a44;
    border-radius:12px;
    padding:10px;
    box-shadow:0 10px 24px -8px #000;
    width:172px;
  }
  .settings-title{
    font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }
  .km-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .km-grid button{
    border:1px solid #333a44;
    background:var(--panel);
    color:var(--text);
    font-family:ui-monospace,'SFMono-Regular','Roboto Mono',Menlo,Consolas,monospace;
    font-size:12px;
    font-weight:600;
    padding:6px 0;
    border-radius:6px;
    cursor:pointer;
  }
  .km-grid button.active{
    background:var(--brass);
    color:#1a1408;
    border-color:var(--brass);
  }
  .readout-overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .big-num{
    font-family:ui-monospace,'SFMono-Regular','Roboto Mono',Menlo,Consolas,monospace;
    font-weight:700;
    font-size:38px;
    letter-spacing:.02em;
    color:var(--text);
    line-height:1;
  }
  .big-num small{font-size:15px;color:var(--muted);font-weight:400;margin-left:3px;}
  .sub-num{
    font-family:ui-monospace,'SFMono-Regular','Roboto Mono',Menlo,Consolas,monospace;
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
    letter-spacing:.03em;
  }
  .sub-num.cardinal{color:var(--brass);font-size:14px;font-weight:700;letter-spacing:.15em;}
  .sub-num.delta{color:var(--warn);font-size:12.5px;font-weight:700;margin-top:3px;letter-spacing:.03em;}

  #alt-needle{transform-origin:160px 160px;transition:transform .2s ease-out;}

  .hidden{display:none !important;}

  /* Switch */
  .switch{
    display:flex;
    background:var(--panel);
    border-radius:14px;
    padding:5px;
    gap:5px;
    box-shadow:inset 0 2px 6px #000, 0 1px 0 #2c333d;
    width:min(78vw,300px);
  }
  .switch button{
    flex:1;
    border:none;
    border-radius:10px;
    background:transparent;
    color:var(--muted);
    font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    padding:12px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    transition:color .2s;
  }
  .switch button .dot{
    width:6px;height:6px;border-radius:50%;
    background:#454c57;
    transition:background .2s, box-shadow .2s;
  }
  .switch button.active{
    background:var(--panel-2);
    color:var(--text);
    box-shadow:0 2px 4px #000, inset 0 0 0 1px #333a44;
  }
  .switch button.active .dot{background:var(--brass);box-shadow:0 0 6px var(--brass);}

  .action-row{
    width:min(78vw,300px);
    display:flex;
    gap:10px;
  }
  .btn{
    flex:1;
    border:1px solid #333a44;
    background:var(--panel);
    color:var(--text);
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:13px;
    font-weight:500;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
  }
  .btn.primary{
    background:linear-gradient(180deg,#d8b46e,var(--brass));
    color:#1a1408;
    border:none;
    font-weight:700;
  }
  .btn:active{transform:translateY(1px);}

  .permission-screen{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:16px;
    padding:0 8px;
  }
  .permission-screen h1{
    font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:19px;
    margin:0;
  }
  .permission-screen p{
    color:var(--muted);
    font-size:13.5px;
    line-height:1.5;
    margin:0;
    max-width:280px;
  }
  .error-msg{
    color:var(--warn);
    font-size:11.5px;
    font-family:ui-monospace,'SFMono-Regular','Roboto Mono',Menlo,Consolas,monospace;
    letter-spacing:.02em;
    min-height:14px;
    text-align:center;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:10.5px;
    letter-spacing:.06em;
    margin-top:20px;
    text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="device">
  <header>
    <div class="brand"><b>ALT</b> · BRÚJULA</div>
    <div class="status-row"><span id="status-label">Inactivo</span><div class="lamp" id="status-lamp"></div></div>
  </header>

  <main>
    <!-- Permission gate -->
    <div class="permission-screen" id="gate">
      <h1>Activar sensores</h1>
      <p>Esta app usa la brújula y el GPS de tu teléfono para leer orientación y altitud en tiempo real. Los datos no salen del dispositivo.</p>
      <button class="btn primary" id="activate-btn" style="width:200px;">Activar</button>
      <div class="error-msg" id="error-msg"></div>
    </div>

    <!-- Instrument (hidden until activated) -->
    <div id="instrument-wrap" class="hidden" style="display:flex;flex-direction:column;align-items:center;gap:22px;">
      <div class="instrument">
        <button id="alt-settings-btn" class="hidden" aria-label="Configurar escala del altímetro">⚙</button>
        <div id="alt-settings-panel" class="hidden">
          <div class="settings-title">Escala máxima</div>
          <div class="km-grid" id="km-grid"></div>
        </div>
        <div class="face">
          <svg viewBox="0 0 320 320">
            <!-- COMPASS -->
            <g id="compass-view">
              <g id="compass-rose">
                <g id="compass-ticks"></g>
                <g id="ref-marker" class="hidden">
                  <polygon class="ref-pointer" points="160,16 152,4 168,4"></polygon>
                </g>
              </g>
              <polygon class="pointer" points="160,26 152,50 168,50"></polygon>
              <circle cx="160" cy="160" r="3" fill="var(--brass)"></circle>
            </g>
            <!-- ALTIMETER -->
            <g id="alt-view" class="hidden">
              <g id="alt-ticks"></g>
              <g id="alt-needle">
                <polygon class="pointer" points="160,42 155,160 165,160"></polygon>
              </g>
              <circle cx="160" cy="160" r="4" fill="var(--brass)"></circle>
            </g>
          </svg>
          <div class="readout-overlay">
            <!-- compass readout -->
            <div id="compass-readout">
              <div class="big-num" id="heading-num">--<small>°</small></div>
              <div class="sub-num cardinal" id="heading-cardinal">SIN SEÑAL</div>
              <div class="sub-num delta hidden" id="heading-delta">—</div>
            </div>
            <!-- altimeter readout -->
            <div id="alt-readout" class="hidden">
              <div class="big-num" id="alt-num">--<small>m</small></div>
              <div class="sub-num" id="alt-sub">altitud absoluta —</div>
            </div>
          </div>
        </div>
      </div>

      <div class="switch">
        <button id="btn-compass" class="active"><span class="dot"></span>Brújula</button>
        <button id="btn-alt"><span class="dot"></span>Altímetro</button>
      </div>

      <div class="action-row">
        <button class="btn" id="ref-btn">Fijar referencia</button>
        <button class="btn" id="clear-btn">Limpiar</button>
      </div>
      <div class="error-msg" id="live-error"></div>
    </div>
  </main>

  <footer>Panel de instrumentos · uso en campo</footer>
</div>

<script>
(function(){
  const gate = document.getElementById('gate');
  const wrap = document.getElementById('instrument-wrap');
  const activateBtn = document.getElementById('activate-btn');
  const errorMsg = document.getElementById('error-msg');
  const liveError = document.getElementById('live-error');
  const statusLamp = document.getElementById('status-lamp');
  const statusLabel = document.getElementById('status-label');

  const btnCompass = document.getElementById('btn-compass');
  const btnAlt = document.getElementById('btn-alt');
  const compassView = document.getElementById('compass-view');
  const altView = document.getElementById('alt-view');
  const compassReadout = document.getElementById('compass-readout');
  const altReadout = document.getElementById('alt-readout');
  const rose = document.getElementById('compass-rose');
  const headingNum = document.getElementById('heading-num');
  const headingCardinal = document.getElementById('heading-cardinal');
  const headingDelta = document.getElementById('heading-delta');
  const refMarker = document.getElementById('ref-marker');

  const altNeedle = document.getElementById('alt-needle');
  const altNum = document.getElementById('alt-num');
  const altSub = document.getElementById('alt-sub');
  const refBtn = document.getElementById('ref-btn');
  const clearBtn = document.getElementById('clear-btn');
  const altSettingsBtn = document.getElementById('alt-settings-btn');
  const altSettingsPanel = document.getElementById('alt-settings-panel');
  const kmGrid = document.getElementById('km-grid');

  let mode = 'compass';
  let compassActive = false;
  let gpsActive = false;
  let referenceHeadingCompass = null;
  let referenceAltitude = null;
  let currentAltitude = null;
  let currentAccuracy = null;
  let maxKmAltimeter = 5;

  const CIRC = 2 * Math.PI * 128; // ~804.2

  const ALT_START_ANGLE = 216; // 0 arranca abajo-izquierda
  const ALT_SWEEP = 288;       // 4/5 del círculo; el 1/5 restante es la zona muerta abajo

  function buildAltTicks(){
    const group = document.getElementById('alt-ticks');
    const cx = 160, cy = 160, rOuter = 140;
    const totalMeters = maxKmAltimeter * 1000;
    const steps = totalMeters / 100;
    let svg = '';
    for (let i = 0; i <= steps; i++){
      const meters = i * 100;
      const isKm = meters % 1000 === 0;
      const is500 = !isKm && meters % 500 === 0;
      const rInner = isKm ? rOuter - 16 : (is500 ? rOuter - 11 : rOuter - 7);
      const width = isKm ? 2.4 : (is500 ? 1.8 : 1.1);
      const deg = ALT_START_ANGLE + (meters / totalMeters) * ALT_SWEEP;
      const rad = (deg - 90) * Math.PI / 180;
      const x1 = cx + rOuter * Math.cos(rad), y1 = cy + rOuter * Math.sin(rad);
      const x2 = cx + rInner * Math.cos(rad), y2 = cy + rInner * Math.sin(rad);
      svg += `<line class="tick${isKm ? ' major' : ''}" style="stroke-width:${width}px" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
      if (isKm){
        const km = meters / 1000;
        const lx = cx + (rOuter - 28) * Math.cos(rad), ly = cy + (rOuter - 28) * Math.sin(rad);
        svg += `<text class="label-km" x="${lx.toFixed(1)}" y="${(ly + 5).toFixed(1)}">${km}</text>`;
      }
    }
    group.innerHTML = svg;
  }
  buildAltTicks();

  function buildKmGrid(){
    kmGrid.innerHTML = '';
    for (let i = 1; i <= 10; i++){
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = i;
      if (i === maxKmAltimeter) b.classList.add('active');
      b.addEventListener('click', () => {
        maxKmAltimeter = i;
        buildAltTicks();
        buildKmGrid();
        renderAltitude();
        altSettingsPanel.classList.add('hidden');
      });
      kmGrid.appendChild(b);
    }
  }
  buildKmGrid();

  altSettingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    altSettingsPanel.classList.toggle('hidden');
  });
  document.addEventListener('click', (e) => {
    if (!altSettingsPanel.classList.contains('hidden') &&
        !altSettingsPanel.contains(e.target) &&
        e.target !== altSettingsBtn){
      altSettingsPanel.classList.add('hidden');
    }
  });

  function buildCompassTicks(){
    const group = document.getElementById('compass-ticks');
    const cx = 160, cy = 160;
    const rOuter = 140;
    const cardinals = {0:'N',90:'E',180:'S',270:'O'};
    const inter = {45:'NE',135:'SE',225:'SO',315:'NO'};
    let svg = '';
    for(let deg=0; deg<360; deg+=10){
      const isMajor = deg % 30 === 0;
      const rInner = isMajor ? rOuter-14 : rOuter-8;
      const rad = (deg-90) * Math.PI/180;
      const x1 = cx + rOuter*Math.cos(rad), y1 = cy + rOuter*Math.sin(rad);
      const x2 = cx + rInner*Math.cos(rad), y2 = cy + rInner*Math.sin(rad);
      svg += `<line class="tick${isMajor?' major':''}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
    }
    for(const deg in cardinals){
      const rad = (deg-90) * Math.PI/180;
      const x = cx + (rOuter-28)*Math.cos(rad), y = cy + (rOuter-28)*Math.sin(rad);
      svg += `<text class="label-cardinal" x="${x.toFixed(1)}" y="${(y+6).toFixed(1)}">${cardinals[deg]}</text>`;
    }
    for(const deg in inter){
      const rad = (deg-90) * Math.PI/180;
      const x = cx + (rOuter-24)*Math.cos(rad), y = cy + (rOuter-24)*Math.sin(rad);
      svg += `<text class="label-inter" x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}">${inter[deg]}</text>`;
    }
    group.innerHTML = svg;
  }
  buildCompassTicks();

  function cardinalFromDeg(deg){
    const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
    return dirs[Math.round(deg/22.5) % 16];
  }

  function updateStatus(){
    if(compassActive && gpsActive){
      statusLamp.className = 'lamp on';
      statusLabel.textContent = 'Activo';
    } else if(compassActive || gpsActive){
      statusLamp.className = 'lamp warn';
      statusLabel.textContent = 'Parcial';
    } else {
      statusLamp.className = 'lamp';
      statusLabel.textContent = 'Inactivo';
    }
  }

  let roseRotation = 0;
  let lastHeadingRaw = null;

  function handleOrientation(e){
    let heading;
    if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)){
      heading = e.webkitCompassHeading;
    } else if (e.alpha !== null && e.alpha !== undefined){
      heading = 360 - e.alpha;
    } else {
      return;
    }
    heading = ((heading % 360) + 360) % 360;
    compassActive = true;
    updateStatus();

    if (lastHeadingRaw === null){
      roseRotation = -heading;
    } else {
      let delta = heading - lastHeadingRaw;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      roseRotation -= delta;
    }
    lastHeadingRaw = heading;

    rose.style.transform = `rotate(${roseRotation}deg)`;
    headingNum.innerHTML = Math.round(heading) + '<small>°</small>';
    headingCardinal.textContent = cardinalFromDeg(heading);
    updateHeadingDelta(heading);
  }

  function updateHeadingDelta(heading){
    if (referenceHeadingCompass === null){
      headingDelta.classList.add('hidden');
      return;
    }
    let delta = heading - referenceHeadingCompass;
    delta = ((delta + 180) % 360 + 360) % 360 - 180;
    const sign = delta > 0 ? '+' : (delta < 0 ? '−' : '');
    headingDelta.textContent = `${sign}${Math.abs(Math.round(delta))}° desde marca`;
    headingDelta.classList.remove('hidden');
  }

  function onPosition(pos){
    const alt = pos.coords.altitude;
    currentAccuracy = pos.coords.altitudeAccuracy;
    if (alt === null || alt === undefined){
      liveError.textContent = mode==='alt' ? 'GPS sin dato de altitud en este dispositivo.' : '';
      return;
    }
    gpsActive = true;
    updateStatus();
    currentAltitude = alt;
    renderAltitude();
  }

  function onPositionError(err){
    liveError.textContent = mode==='alt' ? 'No se pudo acceder a la ubicación.' : '';
  }

  function renderAltitude(){
    if(currentAltitude === null) return;
    const display = referenceAltitude === null ? currentAltitude : (currentAltitude - referenceAltitude);
    const sign = referenceAltitude !== null && display > 0 ? '+' : '';
    altNum.innerHTML = sign + Math.round(display) + '<small>m</small>';
    if(referenceAltitude === null){
      altSub.textContent = currentAccuracy ? `precisión ± ${Math.round(currentAccuracy)} m` : 'altitud absoluta (GPS)';
    } else {
      altSub.textContent = `abs. ${Math.round(currentAltitude)} m · desde referencia`;
    }
    const totalMeters = maxKmAltimeter * 1000;
    const clamped = Math.max(0, Math.min(currentAltitude, totalMeters));
    const needleDeg = ALT_START_ANGLE + (clamped / totalMeters) * ALT_SWEEP;
    altNeedle.style.transform = `rotate(${needleDeg}deg)`;
  }

  function setCompassReference(){
    if (lastHeadingRaw === null) return;
    referenceHeadingCompass = lastHeadingRaw;
    refMarker.setAttribute('transform', `rotate(${referenceHeadingCompass} 160 160)`);
    refMarker.classList.remove('hidden');
    updateHeadingDelta(lastHeadingRaw);
  }

  function clearCompassReference(){
    referenceHeadingCompass = null;
    refMarker.classList.add('hidden');
    headingDelta.classList.add('hidden');
  }

  refBtn.addEventListener('click', function(){
    if (mode === 'compass'){
      setCompassReference();
    } else if (currentAltitude !== null){
      referenceAltitude = currentAltitude;
      renderAltitude();
    }
  });
  clearBtn.addEventListener('click', function(){
    if (mode === 'compass'){
      clearCompassReference();
    } else {
      referenceAltitude = null;
      renderAltitude();
    }
  });

  function setMode(next){
    mode = next;
    liveError.textContent = '';
    if(next==='compass'){
      btnCompass.classList.add('active');
      btnAlt.classList.remove('active');
      compassView.classList.remove('hidden');
      altView.classList.add('hidden');
      compassReadout.classList.remove('hidden');
      altReadout.classList.add('hidden');
      altSettingsBtn.classList.add('hidden');
      altSettingsPanel.classList.add('hidden');
    } else {
      btnAlt.classList.add('active');
      btnCompass.classList.remove('active');
      altView.classList.remove('hidden');
      compassView.classList.add('hidden');
      altReadout.classList.remove('hidden');
      compassReadout.classList.add('hidden');
      altSettingsBtn.classList.remove('hidden');
    }
  }
  btnCompass.addEventListener('click', ()=>setMode('compass'));
  btnAlt.addEventListener('click', ()=>setMode('alt'));

  async function activate(){
    errorMsg.textContent = '';
    let anyError = [];

    // Geolocation
    if(navigator.geolocation){
      navigator.geolocation.watchPosition(onPosition, onPositionError, {enableHighAccuracy:true, maximumAge:1000});
    } else {
      anyError.push('GPS no disponible en este navegador.');
    }

    // Device orientation
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      try{
        const resp = await DeviceOrientationEvent.requestPermission();
        if(resp === 'granted'){
          window.addEventListener('deviceorientation', handleOrientation, true);
        } else {
          anyError.push('Permiso de orientación denegado.');
        }
      }catch(err){
        anyError.push('No se pudo solicitar el sensor de orientación.');
      }
    } else if ('ondeviceorientationabsolute' in window){
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    } else if (typeof DeviceOrientationEvent !== 'undefined'){
      window.addEventListener('deviceorientation', handleOrientation, true);
    } else {
      anyError.push('Brújula no disponible en este dispositivo.');
    }

    gate.classList.add('hidden');
    wrap.classList.remove('hidden');
    if(anyError.length){
      liveError.textContent = anyError.join(' ');
    }
    updateStatus();
  }

  activateBtn.addEventListener('click', activate);
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
